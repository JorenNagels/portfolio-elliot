name: Sync gallery from Google Drive

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: sudo apt-get update && sudo apt-get install -y rclone

      - id: sync
        run: node scripts/sync-drive-photos.mjs
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.readonly
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: 1h9_O-KQtlLlDSkcSPxcwL1p_C7qE6RaG
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}

      - name: Commit and deploy
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/portfolio src/lib/data.ts
          git commit -m 'Sync gallery photos from Google Drive'
          git push
          # Pushes made with the workflow token don't trigger other workflows, but dispatches do.
          gh workflow run deploy.yml --ref main
